name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test
        run: mvn -B --no-transfer-progress verify
      - name: Smoke-test the executable jar
        run: |
          java -jar target/IP-BranchAndBound-*-all.jar datasets/quinn.cnf; test $? -eq 10
